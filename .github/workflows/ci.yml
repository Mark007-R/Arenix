name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: arenix, POSTGRES_PASSWORD: arenix, POSTGRES_DB: arenix_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARENIX_TEST_DATABASE_URL: postgresql+asyncpg://arenix:arenix@localhost/arenix_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy arenix
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The single-service image used for hosting (render.yaml): build it, start it, check it serves.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arenix .
      - run: docker run -d --name arenix -p 8000:8000 arenix
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health
          curl -fs localhost:8000/ | grep -q ARENIX
          curl -fs localhost:8000/leaderboard/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/room/ABC123)" = "308"
          curl -fs localhost:8000/api/config | grep -q '"payments":"off"'
      - if: failure()
        run: docker logs arenix
